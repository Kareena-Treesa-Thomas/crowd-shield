<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CrowdShield — Load your venue dashboard with an Event ID.">
    <title>CrowdShield — Event Entry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="nav-logo">CrowdShield</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="ai-demo.html" class="nav-link">AI Demo</a>
            <a href="event-entry.html" class="nav-link active">Demo Dashboard</a>
        </div>
        <a href="event-entry.html" class="nav-btn">Login</a>
    </nav>

    <!-- Event Entry -->
    <main class="event-entry-page">
        <div class="event-entry-box">
            <p class="event-label">ENTER YOUR EVENT</p>
            <h1 class="event-heading">Load your venue dashboard.</h1>
            <form id="event-form">
                <input type="text" class="event-input" id="event-id-input" placeholder="Event ID" autocomplete="off">
                <button type="submit" class="event-submit">Load Dashboard</button>
            </form>
            <p class="event-helper">Use <strong>DEMO-001</strong> to explore the live demo event.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" style="position: fixed; bottom: 0; left: 0; right: 0;">
        <p class="footer-copy">&copy; 2025 CrowdShield. Precision Safety Systems.</p>
    </footer>

    <script>
        document.getElementById('event-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var id = document.getElementById('event-id-input').value.trim();
            if (id.length > 0) {
                window.location.href = 'dashboard.html?event=' + encodeURIComponent(id);
            }
        });
    </script>
</body>
</html>
